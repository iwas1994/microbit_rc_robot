<button onclick="send('F')">Forward</button>

<script>
let device, server, uartService, tx;

async function connect() {
  device = await navigator.bluetooth.requestDevice({
    filters: [{ namePrefix: "BBC micro:bit" }],
    optionalServices: ["6e400001-b5a3-f393-e0a9-e50e24dcca9e"]
  });

  server = await device.gatt.connect();
  uartService = await server.getPrimaryService("6e400001-b5a3-f393-e0a9-e50e24dcca9e");
  tx = await uartService.getCharacteristic("6e400002-b5a3-f393-e0a9-e50e24dcca9e");
}

function send(str) {
  const data = new TextEncoder().encode(str);
  tx.writeValue(data);
}
</script>
